    <script>document.documentElement.classList.add("js")</script>
    <!-- Sketchbook loader: only becomes visible if loading takes longer than
         ~0.5s (slow connection), hidden by main.jsx once the page has loaded,
         and hides itself after 12s regardless. Pure CSS, no inline script. -->
    <style>
      #boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;align-content:center;gap:22px;
        background:#0d0d0c radial-gradient(rgba(239,236,229,.06) 1px,transparent 1.4px) 0 0/26px 26px;
        opacity:0;visibility:hidden;pointer-events:none;
        animation:boot-in .35s ease .5s forwards,boot-out .4s ease 10s forwards}
      #boot.is-done{animation:none;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
      #boot svg{overflow:visible}
      .boot__mark{width:120px;height:auto}
      .boot__mark path{fill:transparent;stroke:#f78400;stroke-width:10;stroke-linejoin:round;stroke-linecap:round;
        stroke-dasharray:1;stroke-dashoffset:1;animation:boot-draw 2.4s cubic-bezier(.65,0,.35,1) infinite}
      .boot__mark path+path{animation-delay:.25s}
      .boot__line{width:150px;height:18px}
      .boot__line path{fill:none;stroke:#efece5;stroke-opacity:.5;stroke-width:2.4;stroke-linecap:round;
        stroke-dasharray:1;stroke-dashoffset:1;animation:boot-scribble 1.6s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes boot-in{to{opacity:1;visibility:visible}}
      @keyframes boot-out{to{opacity:0;visibility:hidden}}
      @keyframes boot-draw{0%{stroke-dashoffset:1;fill:transparent}55%{stroke-dashoffset:0;fill:transparent}
        75%{stroke-dashoffset:0;fill:rgba(247,132,0,.9)}90%,100%{stroke-dashoffset:0;fill:rgba(247,132,0,0);stroke-opacity:0}}
      @keyframes boot-scribble{0%{stroke-dashoffset:1}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
      @media (prefers-reduced-motion:reduce){
        .boot__mark path{animation:none;stroke-dashoffset:0;fill:rgba(247,132,0,.9)}
        .boot__line path{animation:none;stroke-dashoffset:0}
      }
    </style>
    <!--app-head-->

      </svg>
    </div>
