<!doctype html>
<!-- Source for public/assets/brand/divlynx-og.jpg (1200x630 share image used by
     Google, LinkedIn, WhatsApp, X). Re-export: screenshot at 1200x630, save as JPG. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="../fonts/fonts.css" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; padding: 64px 72px; color: #efece5; font-family: "Funnel Sans", sans-serif;
    background: #0d0d0c radial-gradient(rgba(239,236,229,.08) 1.2px, transparent 1.7px) 0 0 / 26px 26px;
  }
  .glow { position: absolute; width: 820px; height: 820px; right: -260px; top: -40px; border-radius: 50%;
    background: radial-gradient(circle, rgba(247,132,0,.5), rgba(247,132,0,0) 66%); filter: blur(30px); }
  .logo { position: relative; height: 46px; }
  h1 { position: relative; margin-top: 70px; font-family: "Funnel Display", sans-serif; font-weight: 600;
    font-size: 104px; line-height: .98; letter-spacing: -.045em; }
  .struck { position: relative; color: #8f8c85; white-space: nowrap; }
  .struck svg { position: absolute; left: -2%; top: .36em; width: 104%; height: .3em; overflow: visible; }
  .struck path { fill: none; stroke: #f78400; stroke-width: 9; stroke-linecap: round; }
  .fix { display: block; margin: 6px 0 0 14px; font-family: "Gochi Hand", cursive; font-weight: 400;
    font-size: 84px; letter-spacing: 0; color: #f78400; transform: rotate(-3deg); transform-origin: left; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 58px; display: flex; justify-content: space-between; align-items: baseline; }
  .foot p { font-size: 26px; color: #a6a39b; }
  .foot .url { font-family: "Gochi Hand", cursive; font-size: 34px; color: #f78400; }
  .note { position: absolute; right: 86px; top: 150px; width: 300px; padding: 34px 26px 24px; color: #1d150c;
    background: linear-gradient(175deg, #ffb347, #f9a032); border-radius: 2px 2px 3px 20px / 2px 2px 3px 16px;
    box-shadow: 0 26px 40px -16px rgba(0,0,0,.85); transform: rotate(3deg); }
  .pin { position: absolute; top: 10px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9a9a9a 0 16%, #2a2a2a 40%, #050505 100%); box-shadow: 2px 4px 5px rgba(0,0,0,.45); }
  .note .l { font-family: "Gochi Hand", cursive; font-size: 30px; line-height: 1; }
  .note ul { list-style: none; margin-top: 12px; display: grid; gap: 8px; font-family: "Funnel Display", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
  .note li::before { content: "✓ "; }
</style>
</head>
<body>
  <span class="glow"></span>
  <img class="logo" src="../../public/assets/brand/divlynx-logo-horizontal.webp" alt="Divlynx" />
  <h1>Stop doing it<br /><span class="struck">by hand.<svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M2 12 C 40 7, 90 14, 140 9 S 188 12, 198 7" /></svg></span>
    <span class="fix">^ on autopilot.</span></h1>
  <div class="note"><span class="pin"></span>
    <p class="l">we build</p>
    <ul><li>AI automation</li><li>Voice agents</li><li>n8n workflows</li><li>Web &amp; mobile apps</li></ul>
  </div>
  <div class="foot"><p>AI agents that take the busywork off your team.</p><span class="url">divlynx.com</span></div>
</body>
</html>
